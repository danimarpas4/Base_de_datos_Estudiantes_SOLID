name: Python CI Pipeline

# Trigger: ¿Cuándo se activa este robot?
# Se activará en cada 'push' a la rama main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar tu código en el servidor de GitHub
    - uses: actions/checkout@v3

    # 2. Instalar Python 3.12 (o la versión que prefieras)
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    # 3. Instalar dependencias y herramientas de calidad
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 sqlalchemy python-dotenv
        # Si tuvieras un requirements.txt, usaríamos: pip install -r requirements.txt

    # 4. Auditoría de Código (Linting)
    # Stop the build if there are Python syntax errors or undefined names
    - name: Lint with flake8
      run: |
        # E9, F63, F7, F82 = errores de sintaxis graves
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Aviso sobre complejidad (opcional, no rompe el build si falla)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics